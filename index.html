<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>今日运势 Pro - 科学算命</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日运势">
<meta name="theme-color" content="#1a1040">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  overflow-x:hidden;padding:16px;
}
canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;width:100%;max-width:500px}

.header{text-align:center;margin-bottom:16px}
.header .crystal{font-size:56px;display:block;cursor:pointer;user-select:none;transition:transform .1s}
.header .crystal.shake{animation:shake .5s ease-in-out}
@keyframes shake{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(-15deg)}
  30%{transform:rotate(13deg)}
  45%{transform:rotate(-10deg)}
  60%{transform:rotate(8deg)}
  75%{transform:rotate(-4deg)}
  90%{transform:rotate(2deg)}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.header h1{
  font-size:30px;background:linear-gradient(135deg,#f5af19,#f12711,#f5af19);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:900;letter-spacing:2px;margin:4px 0 2px;
}
.header .subtitle{color:rgba(255,255,255,.45);font-size:12px;letter-spacing:3px}
.header .date{color:rgba(255,255,255,.35);font-size:11px;margin-top:2px}
.persona{
  display:inline-block;margin-top:6px;padding:4px 12px;border-radius:12px;
  background:rgba(255,175,25,.1);border:1px solid rgba(255,175,25,.2);
  color:#f5af19;font-size:12px;letter-spacing:1px;transition:all .3s
}
.persona.poison-mode{background:rgba(255,8,68,.1);border-color:rgba(255,8,68,.2);color:#ff6b81}

/* Tab bar */
.tab-bar{display:flex;gap:4px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{
  padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);font-size:14px;
  cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap
}
.tab-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.poison-toggle{font-size:13px}
.poison-toggle.active{
  background:linear-gradient(135deg,rgba(255,8,68,.35),rgba(180,0,30,.3));
  border-color:rgba(255,100,120,.4);color:#ff6b81;box-shadow:0 0 18px rgba(255,8,68,.25)
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(123,47,247,.4),rgba(255,8,68,.3));
  border-color:rgba(180,130,255,.4);color:#fff;box-shadow:0 0 20px rgba(123,47,247,.25)
}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Card */
.card{
  background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px 24px;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  transition:opacity .3s
}
.card.fade{opacity:.4}

/* Categories */
.cat-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.cat-btn{
  padding:5px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-size:12px;
  cursor:pointer;transition:all .25s;font-family:inherit
}
.cat-btn.active{background:linear-gradient(135deg,rgba(123,47,247,.4),rgba(255,8,68,.3));border-color:rgba(180,130,255,.4);color:#fff}

.fortune-icon{font-size:44px;display:block;margin-bottom:10px}
.fortune-text{font-size:20px;color:#fff;font-weight:700;line-height:1.6;margin-bottom:8px;min-height:64px;display:flex;align-items:center;justify-content:center}
.fortune-reason{font-size:11px;color:rgba(255,255,255,.35);font-style:italic;margin-bottom:20px;min-height:16px}

/* Score ring */
.score-section{margin-bottom:20px}
.score-ring{
  display:inline-block;width:72px;height:72px;border-radius:50%;
  background:conic-gradient(#f5af19 var(--s),rgba(255,255,255,.08) var(--s));position:relative;--s:73%
}
.score-ring::before{content:'';position:absolute;top:5px;left:5px;right:5px;bottom:5px;border-radius:50%;background:#1a1040}
.score-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;color:#f5af19}
.score-label{color:rgba(255,255,255,.35);font-size:11px;margin-top:6px}
.weather{font-size:14px;margin-top:4px;letter-spacing:1px}
.roast-quote{font-size:11px;color:rgba(255,255,255,.25);font-style:italic;margin-bottom:18px;min-height:16px}
.lucky-char{width:36px;height:36px;border-radius:50%;background:rgba(255,175,25,.12);border:2px solid rgba(255,175,25,.3);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#f5af19;margin:0 auto 2px}
.lucky-char-mean{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}

/* Lucky row */
.lucky-row{display:flex;justify-content:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.lucky-item{text-align:center}
.lucky-item .ll{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:5px;letter-spacing:1px}
.num-row{display:flex;gap:5px}
.num-ball{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e74c3c,#c0392b);
  box-shadow:0 3px 10px rgba(231,76,60,.35),inset 0 1px 2px rgba(255,255,255,.25)
}
.num-ball.blue{background:linear-gradient(135deg,#3498db,#2980b9);box-shadow:0 3px 10px rgba(52,152,219,.35),inset 0 1px 2px rgba(255,255,255,.25)}
.color-dot{width:30px;height:30px;border-radius:50%;margin:0 auto;box-shadow:0 0 14px var(--sc);border:2px solid rgba(255,255,255,.15)}
.dir-icon{font-size:24px}
.dir-text{font-size:13px;color:#fff;font-weight:600}

/* Dos/Don'ts */
.dd-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.dd-do,.dd-dont{flex:1;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5}
.dd-do{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.15);color:#2ecc71}
.dd-dont{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.15);color:#e74c3c}
.dd-t{font-size:15px;display:block;margin-bottom:2px}

/* Metrics grid */
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.m-item{text-align:left}
.m-item .ml{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:3px}
.m-item .mb{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.m-item .mf{height:100%;border-radius:3px;transition:width .8s}
.mf-a{background:linear-gradient(90deg,#f5af19,#f12711)}
.mf-b{background:linear-gradient(90deg,#7b2ff7,#f5af19)}
.mf-c{background:linear-gradient(90deg,#3498db,#7b2ff7)}

/* Buttons */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  padding:10px 20px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;
  border:none;transition:all .25s;font-family:inherit;letter-spacing:1px
}
.btn-primary{background:linear-gradient(135deg,#7b2ff7,#ff0844);color:#fff;box-shadow:0 5px 20px rgba(123,47,247,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 7px 26px rgba(123,47,247,.5)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12)}
.btn-secondary:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-poster{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff;box-shadow:0 5px 20px rgba(245,175,25,.3)}
.btn-poster:hover{transform:translateY(-1px);box-shadow:0 7px 26px rgba(245,175,25,.45)}

/* Card rarity badge */
.card-rarity-badge{
  position:absolute;top:14px;right:16px;padding:4px 10px;border-radius:10px;
  font-size:11px;font-weight:900;letter-spacing:1px;opacity:0;transform:scale(.8);
  transition:all .4s cubic-bezier(.175,.885,.32,1.275)
}
.card-rarity-badge.show{opacity:1;transform:scale(1)}
.card{position:relative}

/* Ask box */
.ask-box{margin-bottom:18px}
.ask-input{
  width:100%;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;font-family:inherit;
  outline:none;transition:all .3s
}
.ask-input:focus{border-color:rgba(180,130,255,.4);box-shadow:0 0 16px rgba(123,47,247,.15)}
.ask-input::placeholder{color:rgba(255,255,255,.2)}
.ask-answer{font-size:12px;color:rgba(180,130,255,.7);margin-top:6px;min-height:0;transition:all .4s;text-align:center;letter-spacing:1px}

/* Challenge */
.challenge-box{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;
  background:rgba(245,175,25,.06);border:1px solid rgba(245,175,25,.12);
  margin-bottom:20px;font-size:13px;color:#f5af19;flex-wrap:wrap;justify-content:center
}
.challenge-done{
  padding:4px 10px;border-radius:8px;border:1px solid rgba(46,204,113,.3);
  background:rgba(46,204,113,.1);color:#2ecc71;font-size:11px;cursor:pointer;
  font-family:inherit;transition:all .2s
}
.challenge-done:hover{background:rgba(46,204,113,.2)}
.challenge-done.done{background:rgba(46,204,113,.2);border-color:rgba(46,204,113,.5);color:#fff}

/* Accuracy vote */
.accuracy-vote{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.vote-label{color:rgba(255,255,255,.3);font-size:11px}
.vote-btn{
  padding:5px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-size:12px;
  cursor:pointer;transition:all .2s;font-family:inherit
}
.vote-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.vote-btn.voted{background:rgba(123,47,247,.2);border-color:rgba(180,130,255,.3);color:#c084fc}
.vote-stats{font-size:10px;color:rgba(255,255,255,.25)}

/* Card gallery */
.collection-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cstat{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.04);font-size:11px;color:rgba(255,255,255,.5)}
.cstat b{color:#f5af19}
.card-gallery{display:flex;gap:6px;flex-wrap:wrap;max-height:200px;overflow-y:auto}
.gallery-card{
  width:52px;height:52px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:10px;cursor:pointer;
  transition:all .2s;position:relative
}
.gallery-card:hover{transform:scale(1.08)}
.gallery-card .gc-icon{font-size:20px}
.gallery-card .gc-rarity{font-size:8px;font-weight:900;margin-top:1px}
.gallery-card .gc-day{font-size:8px;color:rgba(255,255,255,.35)}
.gallery-card-tip{font-size:10px;color:rgba(255,255,255,.2);text-align:center;padding:20px;width:100%}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.88);color:#fff;padding:10px 22px;border-radius:50px;
  font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s
}
.toast.show{opacity:1}

/* Sound toggle */
.sound-toggle{
  position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;z-index:10;display:flex;
  align-items:center;justify-content:center;transition:all .25s
}
.sound-toggle:hover{background:rgba(255,255,255,.15);color:#fff}

/* ── Tarot ─────────────────────── */
.tarot-info{color:rgba(255,255,255,.5);font-size:12px;margin-bottom:16px;line-height:1.6}
.tarot-slots{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.tarot-slot{
  flex:1;min-width:90px;max-width:130px;aspect-ratio:2/3;
  border-radius:14px;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;flex-direction:column
}
.tarot-slot:hover{border-color:rgba(180,130,255,.5);background:rgba(255,255,255,.08)}
.tarot-slot.revealed{border-style:solid;border-color:rgba(180,130,255,.3);cursor:default;background:rgba(123,47,247,.1)}
.tarot-slot .slot-label{color:rgba(255,255,255,.3);font-size:12px;position:absolute;top:10px}
.tarot-slot .card-back{font-size:40px;opacity:.3;transition:all .3s}
.tarot-slot.revealed .card-icon{font-size:40px}
.tarot-slot.revealed .card-name{color:#fff;font-size:13px;font-weight:700;margin-top:4px}
.tarot-slot.revealed .card-pos{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.tarot-slot.revealed .card-mean{font-size:10px;color:rgba(255,255,255,.45);margin-top:4px;padding:0 8px;line-height:1.4}
.tarot-draw-btn{margin-top:8px}

/* ── Leaderboard ────────────────── */
.lb-header{color:rgba(255,255,255,.5);font-size:12px;margin-bottom:16px}
.lb-list{list-style:none;text-align:left}
.lb-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;
  margin-bottom:6px;background:rgba(255,255,255,.03);font-size:13px;color:#fff
}
.lb-item.me{background:rgba(123,47,247,.15);border:1px solid rgba(180,130,255,.25)}
.lb-rank{font-weight:900;font-size:16px;width:28px;text-align:center}
.lb-rank.gold{color:#f5af19}.lb-rank.silver{color:#c0c0c0}.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1}.lb-score{color:#f5af19;font-weight:700}.lb-tag{font-size:10px;color:rgba(255,255,255,.4)}

/* ── Profile ────────────────────── */
.profile-section{margin-bottom:20px;text-align:left}
.profile-section h3{color:rgba(255,255,255,.6);font-size:14px;margin-bottom:10px;letter-spacing:1px}
.zodiac-select{
  width:100%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;font-family:inherit;cursor:pointer
}
.zodiac-select option{background:#1a1040;color:#fff}
.streak-box{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)
}
.streak-fire{font-size:32px}
.streak-num{font-size:28px;font-weight:900;color:#f5af19}
.streak-label{color:rgba(255,255,255,.5);font-size:12px}
.streak-badge{font-size:20px;margin-left:auto}
.history-item{
  padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:4px;
  font-size:11px;color:rgba(255,255,255,.5);display:flex;justify-content:space-between
}
.custom-dd-input{
  width:100%;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;font-family:inherit;margin-bottom:6px
}
.custom-dd-input::placeholder{color:rgba(255,255,255,.25)}


@media(max-width:420px){
  .card{padding:20px 14px}
  .fortune-text{font-size:17px}
  .header h1{font-size:26px}
  .header .crystal{font-size:44px}
  .tab-btn{padding:6px 10px;font-size:12px}
  .cat-btn{padding:4px 10px;font-size:11px}
  .lucky-row{gap:8px}
  .num-ball{width:26px;height:26px;font-size:11px}
  .tarot-slot{min-width:70px}
  .tarot-slot .card-back{font-size:30px}
  .dd-do,.dd-dont{font-size:11px;padding:6px 10px}
  .ask-input{font-size:12px;padding:8px 12px}
  .btn{padding:8px 16px;font-size:13px}
  .actions{gap:6px}
  .score-ring{width:60px;height:60px}
  .score-inner{font-size:18px}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <div class="header">
    <span class="crystal" id="crystalBall" title="点我抽签">🔮</span>
    <h1>今日运势</h1>
    <div class="subtitle">科 学 算 命 · 有 理 有 据</div>
    <div class="persona" id="personaTag"></div>
    <div class="date" id="dateDisplay"></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="fortune">🔮 每日运势</button>
    <button class="tab-btn" data-tab="tarot">🎴 塔罗牌</button>
    <button class="tab-btn" data-tab="leaderboard">🏆 排行榜</button>
    <button class="tab-btn" data-tab="profile">⚙️ 我的</button>
    <button class="tab-btn poison-toggle" id="poisonToggle" title="切换毒鸡汤模式">💀 毒鸡汤</button>
  </div>

  <!-- Fortune Tab -->
  <div class="tab-panel active" id="tab-fortune">
    <div class="card" id="fortuneCard">
      <div class="card-rarity-badge" id="rarityBadge"></div>
      <div class="ask-box">
        <input class="ask-input" id="askInput" placeholder="🔮 想问什么？（输入问题后按回车）" maxlength="60">
        <div class="ask-answer" id="askAnswer"></div>
      </div>
      <div class="cat-row" id="catRow"></div>
      <span class="fortune-icon" id="fortuneIcon">✨</span>
      <div class="fortune-text" id="fortuneText"></div>
      <div class="fortune-reason" id="fortuneReason"></div>
      <div class="roast-quote" id="roastQuote"></div>
      <div class="score-section">
        <div class="score-ring" id="scoreRing"><div class="score-inner" id="scoreNum"></div></div>
        <div class="score-label">综合运势指数</div>
      <div class="weather" id="weatherTag"></div>
      </div>
      <div class="lucky-row">
        <div class="lucky-item"><div class="ll">🎱 幸运数字</div><div class="num-row" id="luckyNums"></div></div>
        <div class="lucky-item"><div class="ll">🎨 幸运色</div><div class="color-dot" id="luckyColor"></div></div>
        <div class="lucky-item"><div class="ll">🧭 幸运方位</div><div class="dir-icon">🧭</div><div class="dir-text" id="luckyDir"></div></div>
        <div class="lucky-item"><div class="ll">🀄 幸运汉字</div><div class="lucky-char" id="luckyChar"></div><div class="lucky-char-mean" id="luckyCharMean"></div></div>
      </div>
      <div class="dd-row">
        <div class="dd-do"><span class="dd-t">✅ 宜</span><span id="doText"></span></div>
        <div class="dd-dont"><span class="dd-t">❌ 忌</span><span id="dontText"></span></div>
      </div>
      <div class="challenge-box" id="challengeBox">
        <span>🎯 今日挑战：</span><span id="challengeText"></span>
        <button class="challenge-done" id="challengeDone">✅ 完成</button>
      </div>
      <div class="m-grid" id="mGrid"></div>
      <div class="actions">
        <button class="btn btn-primary" id="btnDraw">✨ 重新算一卦</button>
        <button class="btn btn-poster" id="btnPoster">🖼️ 生成海报</button>
        <button class="btn btn-secondary" id="btnShare">📋 复制文案</button>
      </div>
      <div class="accuracy-vote" id="accuracyVote">
        <span class="vote-label">今日运势</span>
        <button class="vote-btn" data-vote="up" title="太准了！">👍 准</button>
        <button class="vote-btn" data-vote="down" title="一点也不准">👎 不准</button>
        <span class="vote-stats" id="voteStats"></span>

const SFX = {
  ctx: null, enabled: LS.get('sound', true),
  init(){
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.enabled=false}
  },
  play(fn){
    if(!this.enabled||!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    fn(this.ctx);
  },
  shake(){
    this.play(ctx=>{
      const now=ctx.currentTime;
      for(let i=0;i<8;i++){
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.value=60+Math.random()*100;o.type='triangle';
        g.gain.setValueAtTime(.04,now+i*.07);
        g.gain.exponentialRampToValueAtTime(.001,now+i*.07+.07);
        o.start(now+i*.07);o.stop(now+i*.07+.07);
      }
    });
  },
  ding(){
    this.play(ctx=>{
      const now=ctx.currentTime;
      [523,659,784,1047].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.value=f;o.type='sine';
        g.gain.setValueAtTime(0,now+i*.1);
        g.gain.linearRampToValueAtTime(.12,now+i*.1+.04);
        g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.25);
        o.start(now+i*.1);o.stop(now+i*.1+.25);
      });
    });
  },
  toggle(){
    this.enabled=!this.enabled;LS.set('sound',this.enabled);
    document.getElementById('soundToggle').textContent=this.enabled?'🔊':'🔇';
  }
};

// Card collection rarity system
function getRarity(score){
  if(score>=90)return {name:'SSR',color:'#f5af19',bg:'rgba(245,175,25,.12)',border:'rgba(245,175,25,.4)',glow:'0 0 24px rgba(245,175,25,.35)',icon:'👑'};
  if(score>=75)return {name:'SR',color:'#c084fc',bg:'rgba(192,132,252,.12)',border:'rgba(192,132,252,.4)',glow:'0 0 16px rgba(192,132,252,.25)',icon:'💎'};
  if(score>=55)return {name:'R',color:'#60a5fa',bg:'rgba(96,165,250,.1)',border:'rgba(96,165,250,.3)',glow:'0 0 10px rgba(96,165,250,.15)',icon:'⭐'};
  return {name:'N',color:'#9ca3af',bg:'rgba(156,163,175,.08)',border:'rgba(156,163,175,.2)',glow:'none',icon:'📋'};
}

function saveCard(){
  const cards=LS.get('cards',[]);
  const today=getDayKey(new Date());
  const exists=cards.findIndex(c=>c.date===today);
  const rarity=getRarity(currentScore);
  const lc=document.getElementById('luckyChar').textContent;
  const card={
    date:today,score:currentScore,rarity:rarity.name,
    fortune:currentFortuneText.slice(0,30),
    icon:poisonMode?'💀':FORTUNE_DATA[currentCat].icon,
    char:lc||'?',
    cat:currentCat,poison:poisonMode
  };
  if(exists>=0)cards[exists]=card;else cards.push(card);
  LS.set('cards',cards);
  return {card,rarity,isNew:exists<0};
}

function getCollectionStats(){
  const cards=LS.get('cards',[]);
  const ssr=cards.filter(c=>c.rarity==='SSR').length;
  const sr=cards.filter(c=>c.rarity==='SR').length;
  return {total:cards.length,ssr,sr,cards};
}

// ═══════════════════════════════════════
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function todaySeed(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function zodiacSeed(){
  const z=LS.get('zodiac','');
  if(!z)return 0;
  return ZODIACS.indexOf(z)+1;
}

function randInt(r,min,max){return Math.floor(r()*(max-min+1))+min}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function shuffle(r,arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  document.getElementById('tarotSlots').innerHTML=[0,1,2].map(i=>{

function revealTarot(idx){
  if(tarotRevealed[idx])return;
  tarotRevealed[idx]=true;
  SFX.ding();

  const card=TAROT_CARDS[Math.floor(Math.random()*TAROT_CARDS.length)];
  const upright=Math.random()>.45;
  const labels=['过去','现在','未来'];

  const slots=document.querySelectorAll('#tarotSlots .tarot-slot');
  const slot=slots[idx];
  slot.classList.add('revealed');
  slot.innerHTML=`
    <span class="slot-label">${labels[idx]}</span>
    <span class="card-icon">${card.icon}</span>
    <span class="card-name">${card.name}${upright?' 正位':' 逆位'}</span>
    <span class="card-pos">${upright?'▲ 正位':'▼ 逆位'}</span>
    <span class="card-mean">${upright?card.up:card.rev}</span>
  `;

  // If all revealed, track
  if(tarotRevealed.every(Boolean)){
    trackStreak();
  }
}

    gallery.innerHTML=stats.cards.slice(-30).reverse().map(c=>{
      const r=getRarity(c.score);
      return `<div class="gallery-card" style="background:${r.bg};border:1px solid ${r.border}" title="${c.date} · ${c.score}分 · ${c.rarity}">
        <span class="gc-icon">${c.icon}</span>
        <span class="gc-rarity" style="color:${r.color}">${c.rarity}</span>
        <span class="gc-day">${c.date.slice(5)}</span>
      </div>`;
    }).join('');
  }

  // Custom DD
  document.getElementById('customDo').value=LS.get('customDo','');
  document.getElementById('customDont').value=LS.get('customDont','');
}

function getStreak(){
  const lastDate=LS.get('lastDrawDate','');
  const today=getDayKey(new Date());
  if(lastDate===today)return LS.get('streak',0);
  if(!lastDate)return 0;
  const last=new Date(lastDate);
  const todayDate=new Date(today);
  const diff=Math.floor((todayDate-last)/(1000*60*60*24));
  if(diff===1)return LS.get('streak',0);
  return 0;
}
function trackStreak(){
  const today=getDayKey(new Date());
  const lastDate=LS.get('lastDrawDate','');
  let streak=LS.get('streak',0);
  if(lastDate===today)return;
  const last=new Date(lastDate);
  const todayDate=new Date(today);
  const diff=lastDate?Math.floor((todayDate-last)/(1000*60*60*24)):999;
  if(diff===1)streak+=1;else streak=1;
  LS.set('lastDrawDate',today);
  LS.set('streak',streak);
  renderProfile();
}
function saveHistory(){
  const history=LS.get('history',[]);
  const d=new Date();
  history.push({
    date:getDayKey(d),
    cat:FORTUNE_DATA[currentCat].name,
    catIcon:FORTUNE_DATA[currentCat].icon,
    score:currentScore,
    text:currentFortuneText
  });
  if(history.length>30)history.shift();
  LS.set('history',history);
}

function generatePoster(){
  toast('正在生成海报...');
  const W=400,H=560;
  const c=document.createElement('canvas');
  c.width=W*2;c.height=H*2;
  const ctx=c.getContext('2d');
  ctx.scale(2,2);

  // Background
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1040');grad.addColorStop(1,'#0f0c29');
  ctx.fillStyle=grad;roundRect(ctx,0,0,W,H,20);ctx.fill();

  // Stars
  const sr=seedRand(todaySeed()+99999);
  for(let i=0;i<40;i++){
    const sx=Math.floor(sr()*W),sy=Math.floor(sr()*H),ss=sr()*1.5+.3;
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${sr()*.4+.1})`;ctx.fill();
  }

  // Title
  ctx.fillStyle='#f5af19';ctx.font='bold 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillText('🔮 今日运势',W/2,50);

  // Date
  const d=new Date();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,W/2,74);

  // Score
  ctx.fillStyle='#f5af19';ctx.font='bold 48px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(String(currentScore),W/2,124);
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('综合运势指数',W/2,142);

  // Divider
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(40,162);ctx.lineTo(W-40,162);ctx.stroke();

  // Fortune text (wrapped)
  ctx.fillStyle='#fff';ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  const lines=wrapText(ctx,currentFortuneText,W-60);
  lines.forEach((l,i)=>ctx.fillText(l,W/2,188+i*24));

  // Reason
  const reasonY=188+lines.length*24;
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='italic 10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('📐 '+currentFortuneReason,W/2,reasonY+4);

  // Divider
  const ddY=reasonY+28;
  ctx.strokeStyle='rgba(255,255,255,0.1)';
  ctx.beginPath();ctx.moveTo(40,ddY);ctx.lineTo(W-40,ddY);ctx.stroke();

  // Dos
  ctx.fillStyle='#2ecc71';ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('✅ 宜：',44,ddY+30);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(currentDo,86,ddY+30);

  // Don'ts
  ctx.fillStyle='#e74c3c';ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('❌ 忌：',44,ddY+54);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(currentDont,86,ddY+54);

  // Watermark
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillText('—— 科学算命 · 有理有据 ——',W/2,H-24);

  // Download
  c.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.download=`今日运势_${getDayKey(d)}.png`;
    a.href=url;a.click();
    URL.revokeObjectURL(url);
    toast('海报已下载！📸');
  },'image/png');
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx,text,maxW){
  const words=text.split('');const lines=[];let line='';
  for(let i=0;i<words.length;i++){
    const test=line+words[i];
    if(ctx.measureText(test).width>maxW&&line.length>0){lines.push(line);line=words[i]}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

const Particles={speedMult:1,particles:[],canvas:null,ctx:null};
(function(){
  const c=document.getElementById('particles');
  Particles.canvas=c;Particles.ctx=c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);

  class P{
    constructor(){this.reset();this.y=Math.random()*c.height}
    reset(){this.x=Math.random()*c.width;this.y=-10;this.s=.5+Math.random()*2;this.sp=.2+Math.random()*.5;this.o=.2+Math.random()*.5;this.w=Math.random()*2-1;this.ws=.005+Math.random()*.01;this.wa=.2+Math.random()*.4}
    update(mult){this.y+=this.sp*mult;this.x+=Math.sin(this.w)*this.wa;this.w+=this.ws;if(this.y>c.height+10)this.reset()}
    draw(ctx){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`rgba(200,180,255,${this.o})`;ctx.fill()}
  }
  for(let i=0;i<80;i++)Particles.particles.push(new P());
  function animate(){
    const ctx=Particles.ctx,canvas=Particles.canvas;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    Particles.particles.forEach(p=>{p.update(Particles.speedMult);p.draw(ctx)});
    requestAnimationFrame(animate);
  }
  animate();
})();
Particles.setSpeed=function(m){this.speedMult=m};
